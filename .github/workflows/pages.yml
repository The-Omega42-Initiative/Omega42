name: pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build the site from the record
        run: python3 tools/site_build.py --out _site --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME"
      - name: Checkout ChatGPT preview
        uses: actions/checkout@v4
        with:
          ref: e4458ee563238ae7f7a4d2e07f03566581677544
          path: _preview_chatgpt
          persist-credentials: false
      - name: Checkout Claude preview
        uses: actions/checkout@v4
        with:
          ref: 3b8fe6094272216b2a9241943118fe3b96f715e4
          path: _preview_claude
          persist-credentials: false
      - name: Build isolated design previews
        run: |
          mkdir -p _site/previews/chatgpt
          cp _preview_chatgpt/design-chatgpt/*.html _site/previews/chatgpt/
          (cd _preview_claude && python3 tools/site_build.py --out "$GITHUB_WORKSPACE/_site/previews/claude" --repo "$GITHUB_REPOSITORY" --branch claude-omega42-website)
          test -s _site/previews/chatgpt/index.html
          test -s _site/previews/claude/index.html
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><title>Omega42 design previews</title><h1>Omega42 design previews</h1><p>Proposals, not canonical releases.</p><p><a href="chatgpt/index.html">ChatGPT design</a></p><p><a href="claude/index.html">Claude design</a></p><p><a href="../index.html">Current website</a></p></html>' > _site/previews/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
