name: path-b-prototype-isolation
on:
  push:
    branches:
      - proposal/path-b-release-packaging
  pull_request:
    branches:
      - main
    paths:
      - tools/path_b_prototype_test.py
      - .github/workflows/path-b-prototype-isolation.yml
      - docs/proposals/PATH_B_*_AUDIT.md
      - docs/proposals/RELEASE_PACKAGING_ARCHITECTURE_PATH_B_PROPOSAL.md
permissions:
  contents: read
jobs:
  isolated-prototypes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build isolated temporary packages and run declared commands
        run: python3 tools/path_b_prototype_test.py
      - name: Characterize D2-B registered-form dispatch without running checkers
        run: python3 tools/path_b_d2b_form_registry_contract_test.py
      - name: Characterize all 13 D2-B form dispatch paths without running checkers
        run: python3 tools/path_b_d2b_all_forms_dispatch_matrix_test.py
      - name: Test D2-B delegated checker failure propagation without executing checkers
        run: python3 tools/path_b_d2b_delegated_dispatch_test.py
      - name: Test D2-B local output-form dispatch with synthetic controls
        run: python3 tools/path_b_d2b_local_dispatch_test.py
      - name: Inventory L-493 mismatches without changing canonical release gate
        run: python3 tools/path_b_l493_release_diagnostic.py
      - name: Test D5 raw-byte result classification without execution
        run: python3 tools/path_b_d5_result_semantics_test.py
      - name: Test D5 per-certificate approval binding without execution
        run: python3 tools/path_b_d5_execution_contract_test.py
      - name: Test D5 non-executing command preflight with synthetic controls
        run: python3 tools/path_b_d5_execution_preflight_test.py
      - name: Characterize D5 semantics without executing certificate procedures
        run: python3 tools/path_b_d5_certificate_semantics_test.py
