name: Path B D5a synthetic fixture validation

on:
  push:
    branches:
      - proposal/path-b-release-packaging
    paths:
      - "tools/path_b_d5a_fixture_test.py"
      - "tools/path_b_d5a_guard.py"
      - "tools/conformance.py"
      - "tools/format_check.py"
      - "tools/congruence.py"
      - "tools/manifestation.py"
      - "records/conformance/practice_set.txt"
      - ".github/workflows/path-b-d5a-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d5a-synthetic-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and validate eight synthetic fixtures plus negative controls
        run: python tools/path_b_d5a_fixture_test.py
