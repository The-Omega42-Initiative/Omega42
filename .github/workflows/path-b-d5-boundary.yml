name: Path B D5 certificate execution-boundary characterization

on:
  push:
    branches:
      - proposal/path-b-release-packaging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d5-safe-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Characterize D5 semantics without executing certificate procedures
        run: python tools/path_b_d5_certificate_semantics_test.py
