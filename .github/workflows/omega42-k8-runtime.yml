name: Ω42 K8 Runtime Contract
on:
  push:
    branches: [navigator-performance-kernel-v1]
    paths:
      - 'site/omega42-runtime-k8.mjs'
      - 'tests/omega42-runtime-k8.test.mjs'
      - 'schemas/runtime-session-k8.schema.json'
      - '.github/workflows/omega42-k8-runtime.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/omega42-runtime-k8.mjs'
      - 'tests/omega42-runtime-k8.test.mjs'
      - 'schemas/runtime-session-k8.schema.json'
      - '.github/workflows/omega42-k8-runtime.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/omega42-runtime-k8.test.mjs
      - run: node --check site/omega42-runtime-k8.mjs
