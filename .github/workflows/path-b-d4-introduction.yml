name: Path B D4 Introduction isolated validation

on:
  push:
    branches:
      - proposal/path-b-release-packaging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4-introduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Introduction output and Core correspondence
        run: python tools/path_b_d4_introduction_test.py
