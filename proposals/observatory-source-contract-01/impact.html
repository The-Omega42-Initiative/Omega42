<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Structural Impact Engine | Omega42</title><style>body{font:1rem/1.6 system-ui,sans-serif;max-width:60rem;margin:auto;padding:1rem;color:#172033;background:#f8fafc}section{background:white;border:1px solid #aab8cb;padding:1rem;border-radius:10px;margin:1rem 0}select,button{font:inherit;max-width:100%;padding:.5rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#164c9c}:focus-visible{outline:3px solid #164c9c}</style><main><a href="observatory.html">Return to Observatory</a><h1>Structural Impact Engine</h1><p>Plan review of a hypothetical mathematical change. No record is modified, invalidated or executed.</p><label for="record">Proposed change to record</label> <select id="record" disabled></select><p id="status" role="status">Loading…</p><section><h2>Review candidates</h2><ul id="affected"></ul><h2>Certificate paths to inspect</h2><ul id="certificates"></ul><button id="export" disabled>Export local review plan</button></section></main><script type="module">
import {impact} from './impact-engine.mjs';
const el=id=>document.getElementById(id);
try{const [g,r]=await Promise.all(['knowledge-graph.json','register.json'].map(async p=>{const response=await fetch(p);if(!response.ok)throw Error('Source unavailable');return response.json()}));if(g.schema!=='omega42.observatory.graph.v1'||r.schema!=='omega42.observatory.source.v1'||r.source?.blob!=='5db44e140940ffb935a1ded423c9c4f7f69a528f')throw Error('Source mismatch');let plan;function list(id,items){el(id).replaceChildren();for(const item of items){const li=document.createElement('li');li.textContent=item;el(id).append(li)}}function show(){plan=impact(g,r,el('record').value);el('status').textContent=plan.direct+' direct and '+plan.indirect+' indirect review candidates; '+plan.certificates.length+' distinct certificate paths including changed record.';list('affected',plan.affected.map(x=>x.id+' — distance '+x.distance+' — '+x.status));list('certificates',plan.certificates)}for(const x of r.records){const o=document.createElement('option');o.value=x.id;o.textContent=x.id+' — '+x.domain;el('record').append(o)}el('record').addEventListener('change',show);el('export').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(plan,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='omega42-impact-'+plan.changed+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});show();el('record').disabled=false;el('export').disabled=false}catch(e){el('status').textContent='Unavailable: '+e.message}
</script></html>
