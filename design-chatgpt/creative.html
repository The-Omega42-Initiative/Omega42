<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omega42 Creative Studio</title><style>body{background:#0b1023;color:#e9edf9;font:17px/1.6 system-ui;margin:0}main{max-width:900px;margin:auto;padding:24px}h1,h2{font-family:Georgia;color:#f5c47d}section{border:1px solid #52617e;border-radius:12px;padding:20px;margin:24px 0}label{display:block;margin:12px 0}button,select,input{font:inherit}button,select{background:#243451;color:white;border:1px solid #8292b1;border-radius:6px;padding:9px;margin:4px}a{color:#85e4ef}svg{width:100%;max-height:440px}output{display:block;color:#85e4ef}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><a href="index.html">← Omega42</a><h1>Creative Studio</h1><p>One mathematical cycle. Two forms of expression.</p><section><h2>Harmonia</h2><p>Original experimental tones for contemplation. Not a medical treatment. Keep device volume low; stop if uncomfortable.</p><label>Base pitch <input id="pitch" type="range" min="110" max="440" value="220"> <span id="hz">220 Hz</span></label><label>Output level <input id="vol" type="range" min="0" max="20" value="5"></label><button id="play">Play 24 notes</button><button id="stop">Stop</button><output id="status" aria-live="polite">Ready</output></section><section><h2>Atelier</h2><label>Seed a <input id="a" type="number" min="0" max="8" value="2"></label><label>Seed b <input id="b" type="number" min="0" max="8" value="5"></label><label>Palette <select id="palette"><option>Celestial</option><option>Solar</option><option>Ocean</option></select></label><svg id="art" viewBox="0 0 400 400" role="img" aria-label="Generative orbit artwork"></svg><button id="save">Export SVG</button><button id="recipe">Export recipe</button><output id="artstatus"></output></section></main><script>
'use strict';const $=id=>document.getElementById(id),N=([a,b])=>[b,(a+b)%9];function orbit(a,b){let x=[a,b],out=[];do{out.push(x);x=N(x)}while(x[0]!==a||x[1]!==b);return out}const canonical=orbit(2,5);let ctx=null,active=[],generation=0;function stop(){generation++;if(ctx){const old=ctx;ctx=null;for(const o of active){try{o.stop()}catch{}}active=[];old.close().catch(()=>{})}$('status').textContent='Stopped'}$('stop').onclick=stop;$('pitch').oninput=()=>$('hz').textContent=$('pitch').value+' Hz';$('play').onclick=async()=>{stop();const token=generation;try{const c=new AudioContext();ctx=c;await c.resume();if(token!==generation)return;const start=c.currentTime+.05,base=+$('pitch').value,level=+$('vol').value/100*.2;canonical.forEach(([a],i)=>{const o=c.createOscillator(),g=c.createGain(),t=start+i*.6;o.frequency.value=base*2**(a/9);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(level,t+.04);g.gain.setValueAtTime(level,t+.45);g.gain.linearRampToValueAtTime(0,t+.58);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.6);active.push(o);if(i===23)o.onended=()=>{if(token===generation){stop();$('status').textContent='Cycle complete'}}});$('status').textContent='Playing one canonical cycle (14.4 seconds)'}catch{stop();$('status').textContent='Audio unavailable'}};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
const palettes={Celestial:['#f5c47d','#85e4ef','#b59ce0'],Solar:['#ffcc66','#ff8066','#f4a9c5'],Ocean:['#62e2d5','#739bff','#c0f8f1']};let config;function draw(){const a=+$('a').value,b=+$('b').value;if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||a>8||b<0||b>8){$('artstatus').textContent='Enter integer seeds 0–8';return}const p=$('palette').value,colors=palettes[p],o=orbit(a,b),svg=$('art'),ns='http://www.w3.org/2000/svg';svg.replaceChildren();function el(tag,attrs){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);svg.append(e)}el('rect',{width:400,height:400,fill:'#0b1023'});const pts=o.map(([u,v])=>[200+(35+v*17)*Math.cos(2*Math.PI*u/9),200+(35+v*17)*Math.sin(2*Math.PI*u/9)]);el('polyline',{points:[...pts,pts[0]].map(p=>p.join(',')).join(' '),fill:'none',stroke:colors[0],'stroke-width':2});pts.forEach(([x,y],i)=>{el('circle',{cx:x,cy:y,r:12+o[i][1]*2,fill:'none',stroke:colors[i%3],opacity:.8});el('circle',{cx:x,cy:y,r:3,fill:colors[i%3]})});config={version:1,seed:[a,b],palette:p,orbitLength:o.length,mapping:'angle=2pi*a/9; radius=35+17*b'};$('artstatus').textContent=o.length+' native states in this orbit'};['a','b','palette'].forEach(id=>$(id).oninput=draw);function download(data,type,name){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('save').onclick=()=>download(new XMLSerializer().serializeToString($('art')),'image/svg+xml','omega42-art.svg');$('recipe').onclick=()=>download(JSON.stringify(config,null,2),'application/json','omega42-recipe.json');draw();
</script></html>
