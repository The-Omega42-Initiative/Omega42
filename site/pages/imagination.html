<div class="cg"><div class="cg-in">
<p class="cg-credit">By ChatGPT, Co-Builder · runs in your browser · stores nothing</p>
<h1>Imagination and experience</h1><section><h2>Scriptorium</h2><p>Compose a portable writing brief for your own AI. No AI service is called here.</p><label>Genre <select id="genre"><option>Novel</option><option>Poetry</option><option>Essay</option><option>Short story</option></select></label><label>Theme and audience <textarea id="theme"></textarea></label><label>Mathematical anchor <select id="anchor"><option>Canonical 24-cycle</option><option>Seven-symbol aperture</option><option>Antipodal symmetry</option><option>Constitutional memory</option></select></label><button id="make">Generate writing brief</button><label>Editable brief<textarea id="brief"></textarea></label><button id="export">Export brief</button></section><section><h2>Synesthesia</h2><p>Step through the canonical orbit. Sound is optional, quiet and experimental, not a treatment.</p><label>Phase <input id="phase" type="range" min="0" max="23" value="0"></label><svg id="art" viewBox="0 0 320 320" role="img" aria-label="State geometry"><circle cx="160" cy="160" r="125" fill="none" stroke="#52617e"/><line id="ray" x1="160" y1="160" stroke="#f5c47d" stroke-width="2"/><circle id="dot" r="16"/></svg><output id="state"></output><button id="sound">Hear this state</button><button id="stop">Stop audio</button></section>
</div></div>
<script>

const $=id=>document.getElementById(id);$('make').onclick=()=>{$('brief').value=['Write an original '+$('genre').value.toLowerCase()+' using this brief:', $('theme').value,'Mathematical anchor: '+$('anchor').value,'Use the versioned Omega42 Core and Companion supplied by the author. Distinguish exact mathematical claims from fictional or symbolic interpretation. Do not invent citations. Preserve creative freedom and human editorial approval.'].join('\n\n')};$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([$('brief').value],{type:'text/plain'})),a=document.createElement('a');a.href=u;a.download='omega42-writing-brief.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};const orbit=[];let a=2,b=5;for(let i=0;i<24;i++){orbit.push([a,b]);[a,b]=[b,(a+b)%9]}let ctx=null;function stop(){if(ctx){const c=ctx;ctx=null;c.close().catch(()=>{})}}function draw(){const t=+$('phase').value,[a,b]=orbit[t],theta=2*Math.PI*a/9,r=35+10*b,x=160+r*Math.cos(theta),y=160+r*Math.sin(theta);$('dot').setAttribute('cx',x);$('dot').setAttribute('cy',y);$('dot').setAttribute('fill','hsl('+40*a+' 75% 65%)');$('ray').setAttribute('x2',x);$('ray').setAttribute('y2',y);$('state').textContent='Phase '+t+' · ('+a+','+b+') · '+(220*2**(a/9)).toFixed(1)+' Hz';stop()}$('phase').oninput=draw;$('stop').onclick=stop;$('sound').onclick=async()=>{stop();try{const c=new AudioContext();ctx=c;await c.resume();if(ctx!==c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.frequency.value=220*2**(orbit[+$('phase').value][0]/9);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.015,t+.05);g.gain.linearRampToValueAtTime(0,t+.65);o.connect(g);g.connect(c.destination);o.start();o.stop(t+.7);o.onended=()=>{if(ctx===c)stop()}}catch{stop();$('state').textContent+=' · Audio unavailable'}};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});draw();

</script>
